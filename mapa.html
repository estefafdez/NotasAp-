<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<meta charset="UTF-8">

	<!--CSS-->
	<style type="text/css"></style>
	<link rel="stylesheet" href="css/modelado.css" />
	<link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.2/jquery.mobile-1.4.2.min.css" />

	<!--JavaScript-->
	
	<script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
	<script src="https://code.jquery.com/mobile/1.4.2/jquery.mobile-1.4.2.min.js"></script>

	<!--Fondo-->
	<style type="text/css">
	.ui-page {
		background: transparent url(imagen/fondo.jpg);
	}
	</style>

</head>
<body>
	<!--Home-->
	<div data-role="page" id="page4">
		<div data-theme="b" data-role="header">
			<h3 id="idNombreNota">Notas: </h3>
		</div>
		<div data-role="content">
			<div id="idMenu" data-role="navbar" data-iconpos="top">
				<ul>					
					<li><a onClick="parent.location='listaNotas.html'" data-transition="slide" data-theme="" data-icon=""> Lista de Notas </a></li>
					<li><a onClick="parent.location='anadirNota.html'" data-transition="slide" data-theme="" data-icon=""> Añadir Nota </a></li>
					<li><a onClick="parent.location='mapa.html'" data-transition="slide" data-theme="" data-icon=""> Mapa </a></li>				
				</ul>
			</div>
		</div>

		<script language="javascript">
        function get_loc() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(coordenadas, function() {
                    document.getElementById("mapStatus").textContent = "No se pudo obtener tu ubicación. Revisa el permiso del navegador.";
                });
            }else{
                alert('Tu navegador no soporta la API de geolocalizacion');
            }
        }
        
        function coordenadas(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            var map = document.getElementById("mapa");
            map.href = "https://www.openstreetmap.org/?mlat=" + encodeURIComponent(lat) + "&mlon=" + encodeURIComponent(lon) + "#map=15/" + lat + "/" + lon;
            map.hidden = false;
            document.getElementById("mapStatus").textContent = "Ubicación obtenida. Abre el mapa solo si quieres compartirla con el proveedor.";
        }
        </script>

		<!--Dibujar Mapa-->
		
		<center><a href="javascript:get_loc();">Mostrar localización</a><br></center>
    	<p></p>
    	<p id="mapStatus" role="status">La ubicación se solicita solo al pulsar el botón.</p>
        <p><a id="mapa" hidden target="_blank" rel="noopener noreferrer">Abrir ubicación en OpenStreetMap</a></p>


		<div data-theme="b" data-role="footer" data-position="fixed">
		<center><p>Prototipo Funcional para la asignatura DAW. Creado por Francisco José Caro<br>
		Estefanía Fernández y Sergio Pulido</p></center>
		</div>
	</div>
</body>
</html>
